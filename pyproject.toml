[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salon-booking-api"
version = "1.0.0"
description = "Salon Booking API — FastAPI modular monolith"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["fastapi", "sqlalchemy", "postgresql", "redis", "alembic"]
dependencies = [
    # Framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",

    # Settings & Validation
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",

    # Database & ORM
    "sqlalchemy==2.0.31",
    "greenlet==3.0.3",
    "asyncpg==0.29.0",
    "alembic==1.13.1",

    # Security & Authentication
    "bcrypt==5.0.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",

    # Redis & Async Tasks
    "redis==5.0.6",
    "celery==5.4.0",

    # Monitoring
    "sentry-sdk[fastapi]==2.6.0",

    # Dev friendly
    "fastapi-debug-toolbar==0.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]